<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="app">
    <!-- ============ HEADER ============ -->
    <header class="topbar">
      <h1 class="brand">💪 Workout</h1>
      <nav class="tabs">
        <button class="tab-btn is-active" data-view="workout">Workout</button>
        <button class="tab-btn" data-view="history">History</button>
        <button class="tab-btn" data-view="exercises">Exercises</button>
      </nav>
    </header>

    <main>
      <!-- ============ WORKOUT VIEW ============ -->
      <section id="view-workout" class="view is-active">
        <!-- No active workout -->
        <div id="workout-empty">
          <button id="start-workout" class="btn btn-primary btn-lg btn-block">+ Start empty workout</button>
          <div class="section-label">Your routines</div>
          <div id="routine-list"></div>
          <p id="routine-empty" class="muted routine-hint">No saved routines yet. Start a workout, add your exercises, then tap <b>Save as routine</b> to reuse it next time.</p>
        </div>

        <!-- Active workout -->
        <div id="workout-active" class="hidden">
          <div class="card session-head">
            <div>
              <input id="workout-name" class="workout-name-input" placeholder="Workout name" />
              <div class="session-meta">
                <span id="session-timer">00:00</span>
                <span class="dot">•</span>
                <span id="session-date"></span>
              </div>
            </div>
            <div class="session-actions">
              <button id="finish-workout" class="btn btn-primary">Finish</button>
              <button id="discard-workout" class="btn btn-ghost">Discard</button>
            </div>
          </div>

          <div id="exercise-list"></div>

          <button id="add-exercise" class="btn btn-dashed btn-block">+ Add exercise</button>
          <button id="save-routine" class="btn btn-ghost btn-block save-routine-btn">☆ Save as routine</button>
        </div>
      </section>

      <!-- ============ HISTORY VIEW ============ -->
      <section id="view-history" class="view">
        <div id="history-list"></div>
        <div id="history-empty" class="card center-card hidden">
          <p class="muted">No saved workouts yet. Finish a workout to see it here.</p>
        </div>
      </section>

      <!-- ============ EXERCISES VIEW ============ -->
      <section id="view-exercises" class="view">
        <div class="card">
          <div class="row">
            <input id="new-exercise-name" class="input" placeholder="New exercise name" />
            <select id="new-exercise-muscle" class="input input-select">
              <option value="">Muscle group</option>
              <option>Chest</option>
              <option>Back</option>
              <option>Shoulders</option>
              <option>Biceps</option>
              <option>Triceps</option>
              <option>Legs</option>
              <option>Glutes</option>
              <option>Core</option>
              <option>Cardio</option>
              <option>Other</option>
            </select>
            <button id="add-exercise-def" class="btn btn-primary">Add</button>
          </div>
        </div>
        <div id="exercise-library"></div>
      </section>
    </main>

    <!-- ============ REST TIMER (floating) ============ -->
    <div id="rest-timer" class="rest-timer hidden">
      <div class="rest-inner">
        <button class="rest-adjust" data-delta="-15">−15s</button>
        <div class="rest-display">
          <div id="rest-remaining" class="rest-remaining">0:30</div>
          <div class="rest-label">Rest</div>
        </div>
        <button class="rest-adjust" data-delta="15">+15s</button>
        <button id="rest-skip" class="btn btn-ghost rest-skip">Skip</button>
      </div>
      <div class="rest-bar"><div id="rest-bar-fill" class="rest-bar-fill"></div></div>
    </div>
  </div>

  <!-- ============ EXERCISE PICKER MODAL ============ -->
  <div id="picker-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add exercise</h2>
        <button class="modal-x" data-close>✕</button>
      </div>
      <input id="picker-search" class="input" placeholder="Search exercises…" autocomplete="off" />
      <div id="picker-list" class="picker-list"></div>
    </div>
  </div>

  <!-- ============ REST SETTINGS MODAL ============ -->
  <div id="rest-settings-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Rest timer</h2>
        <button class="modal-x" data-close>✕</button>
      </div>
      <label class="field">
        <span>Default rest between sets</span>
        <div class="row">
          <input id="rest-default-input" class="input" type="number" min="0" step="5" />
          <span class="suffix">seconds</span>
        </div>
      </label>
      <div class="preset-row">
        <button class="chip" data-preset="30">30s</button>
        <button class="chip" data-preset="60">60s</button>
        <button class="chip" data-preset="90">90s</button>
        <button class="chip" data-preset="120">2:00</button>
        <button class="chip" data-preset="180">3:00</button>
      </div>
      <label class="field toggle-field">
        <span>Auto-start timer after logging a set</span>
        <input id="rest-autostart" type="checkbox" />
      </label>
      <label class="field toggle-field">
        <span>Beep when timer ends</span>
        <input id="rest-sound" type="checkbox" />
      </label>
      <button class="btn btn-primary btn-block" data-close>Done</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
